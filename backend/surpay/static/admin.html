<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Surpay Staff</title>
<style>
  :root {
    --bg:#f4f6fa; --card:#ffffff; --sunk:#f8fafc; --text:#0f172a; --muted:#5b6474; --line:#e3e8f0;
    --brand:#0b6e4f; --brand-soft:#e6f4ee; --blue:#2563eb; --warn:#8a5a00; --bad:#b42318;
    --urgent:#b91c1c; --soon:#b45309; --safe:#15803d; --expired:#6b7280; --side:#0b1f17; --side-text:#cfe9dd;
    --shadow:0 1px 2px rgba(15,23,42,.06), 0 4px 16px rgba(15,23,42,.05);
  }
  :root:not([data-theme="light"]) { color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#0b1120; --card:#131c2e; --sunk:#0f1726; --text:#e6eaf2; --muted:#9aa4b5; --line:#23304a; --brand:#34c38f;
    --brand-soft:#123326; --blue:#7aa7ff; --warn:#f2c26b; --bad:#ff8a80; --urgent:#ff8a80; --soon:#f6c26b; --safe:#5bd68c;
    --expired:#a3aab8; --side:#060c18; --side-text:#b9c7dc; --shadow:none; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color:var(--blue); }
  .shell { display:grid; grid-template-columns: 230px 1fr; min-height:100vh; }
  aside#side { background:var(--side); color:var(--side-text); padding:18px 12px; position:sticky; top:0; height:100vh; overflow:auto; }
  aside .brand { font-weight:800; font-size:18px; color:#fff; padding:4px 10px 16px; letter-spacing:.2px; }
  aside .brand span { color:#34c38f; }
  aside button.nav { display:flex; width:100%; gap:10px; align-items:center; background:transparent; color:var(--side-text);
    border:0; padding:9px 10px; border-radius:10px; font-weight:600; text-align:left; cursor:pointer; font-size:14px; }
  aside button.nav:hover { background:rgba(255,255,255,.07); }
  aside button.nav.on { background:#34c38f22; color:#fff; box-shadow: inset 3px 0 0 #34c38f; }
  aside .count { margin-left:auto; background:#34c38f33; color:#fff; border-radius:999px; padding:0 8px; font-size:12px; }
  aside .sep { font-size:11px; text-transform:uppercase; letter-spacing:.08em; opacity:.6; padding:14px 10px 4px; }
  header { display:flex; gap:10px; align-items:center; padding:14px 22px; background:var(--card); border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:5; }
  header h1 { font-size:18px; margin:0; flex:1; }
  main { padding:18px 22px 60px; display:grid; gap:16px; }
  input, select, button, textarea { font:inherit; padding:8px 10px; border-radius:9px; border:1px solid var(--line); background:var(--sunk); color:var(--text); }
  button { background:var(--brand); color:#fff; border:0; font-weight:600; cursor:pointer; }
  button.secondary { background:transparent; color:var(--text); border:1px solid var(--line); }
  button.danger { background:var(--bad); }
  button:disabled { opacity:.5; cursor:default; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; box-shadow:var(--shadow); }
  .card h2 { font-size:16px; margin:0 0 10px; }
  h3 { font-size:12px; margin:14px 0 6px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .muted { color:var(--muted); font-size:13px; }
  .kpis { display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:10px; }
  .kpi { background:var(--sunk); border:1px solid var(--line); border-radius:12px; padding:12px 14px; cursor:default; }
  .kpi.click { cursor:pointer; } .kpi.click:hover { border-color:var(--brand); }
  .kpi b { display:block; font-size:22px; letter-spacing:-.3px; } .kpi span { color:var(--muted); font-size:12px; }
  .grid2 { display:grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap:16px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:8px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:12px; white-space:nowrap; position:sticky; top:0; background:var(--card); }
  th.sort { cursor:pointer; user-select:none; } th.sort:hover { color:var(--text); }
  th .dir { opacity:.8; }
  td.num, th.num { text-align:right; font-variant-numeric: tabular-nums; }
  tr.click { cursor:pointer; } tr.click:hover td { background:var(--sunk); }
  .tablewrap { overflow:auto; max-height:70vh; border:1px solid var(--line); border-radius:12px; }
  .pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600; border:1px solid var(--line); white-space:nowrap; }
  .pill.pending { color:var(--warn); } .pill.approved { color:var(--safe); } .pill.rejected { color:var(--bad); }
  .stage { display:inline-block; padding:2px 9px; border-radius:7px; font-size:12px; font-weight:600; background:var(--brand-soft); color:var(--brand); }
  .clock { display:inline-flex; align-items:center; gap:6px; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:700; white-space:nowrap; }
  .clock::before { content:""; width:8px; height:8px; border-radius:50%; background:currentColor; }
  .track { height:6px; border-radius:3px; background:var(--line); overflow:hidden; margin-top:4px; min-width:90px; }
  .track > div { height:100%; border-radius:3px; }
  .tile { border-radius:12px; padding:12px; cursor:pointer; border:1px solid transparent; }
  .tile b { display:block; font-size:22px; } .tile span { font-size:12px; font-weight:600; }
  .tile:hover { border-color:currentColor; }
  .bar { height:10px; background:var(--brand); border-radius:0 4px 4px 0; min-width:2px; }
  .funnel { display:grid; grid-template-columns: 200px 1fr 70px 60px; gap:6px 10px; align-items:center; font-size:13px; }
  .funnel .lbl { color:var(--text); } .funnel .pct { color:var(--muted); text-align:right; font-variant-numeric: tabular-nums; }
  .funnel .n { text-align:right; font-weight:700; font-variant-numeric: tabular-nums; }
  .cols { display:flex; align-items:flex-end; gap:6px; height:110px; padding-top:6px; }
  .cols div { flex:1; background:var(--brand); border-radius:4px 4px 0 0; min-height:2px; position:relative; }
  .cols div:hover { opacity:.8; }
  .alert { padding:10px 12px; border-radius:10px; background:#fff1d6; color:#6b4a00; margin:6px 0; font-weight:600; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .alert { background:#33260f; color:#f6c26b; } }
  .grid { display:grid; grid-template-columns: 170px 1fr; gap:6px 12px; }
  .grid > div:nth-child(odd) { color:var(--muted); font-size:13px; }
  .docs { display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; }
  .docs img { width:150px; height:110px; object-fit:cover; border-radius:8px; border:1px solid var(--line); cursor:zoom-in; }
  ol { margin:4px 0; padding-left:20px; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; word-break:break-all; }
  #banner { display:none; margin:0; padding:10px 22px; background:#fff1d6; color:#6b4a00; font-weight:600; }
  #msg { margin:0; }
  /* Detail drawer */
  #scrim { position:fixed; inset:0; background:rgba(2,6,23,.45); display:none; z-index:20; }
  #drawer { color:var(--text); position:fixed; top:0; right:0; height:100vh; width:min(760px, 100vw); background:var(--bg); z-index:21;
    transform:translateX(100%); transition:transform .2s ease; overflow:auto; box-shadow:-8px 0 30px rgba(0,0,0,.2); }
  #drawer.open { transform:none; } #scrim.open { display:block; }
  #drawer .top { position:sticky; top:0; background:var(--card); border-bottom:1px solid var(--line); padding:14px 18px; display:flex; gap:10px; align-items:center; z-index:2; }
  #drawer .top h2 { margin:0; font-size:17px; flex:1; }
  #drawer .body { padding:16px 18px; display:grid; gap:14px; }
  .login { max-width:420px; margin:12vh auto; }
  @media (max-width: 860px) {
    .shell { grid-template-columns: 1fr; }
    aside#side { position:static; height:auto; display:flex; gap:4px; overflow-x:auto; padding:8px; }
    aside .brand, aside .sep { display:none; }
    aside button.nav { white-space:nowrap; width:auto; }
    .funnel { grid-template-columns: 120px 1fr 50px 44px; }
    .grid { grid-template-columns: 1fr; }
    main, header { padding-left:16px; padding-right:16px; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside id="side">
    <div class="brand">Sur<span>pay</span> staff</div>
    <button class="nav" data-view="overview">◎ Overview</button>
    <button class="nav" data-view="insights">↗ Where people are</button>
    <div class="sep">Work</div>
    <button class="nav" data-view="reviews">✓ Reviews <span class="count" id="cnt-reviews"></span></button>
    <button class="nav" data-view="claims">▤ Claims</button>
    <button class="nav" data-view="users">☺ People</button>
    <div class="sep">Data</div>
    <button class="nav" data-view="records">⌂ County records</button>
    <button class="nav" data-view="trace">⌕ Find owners</button>
    <button class="nav" data-view="documents">✎ Signed documents</button>
    <button class="nav" data-view="audit">⛓ Audit trail</button>
    <div class="sep">Settings</div>
    <button class="nav" data-view="fees">$ Fees and attorney pay</button>
  </aside>
  <div>
    <header>
      <h1 id="title">Overview</h1>
      <input id="token" type="password" placeholder="Admin token" autocomplete="off" style="width:200px">
      <button id="load">Sign in</button>
      <select id="view" style="display:none">
        <option value="overview"></option><option value="insights"></option><option value="reviews"></option>
        <option value="claims"></option><option value="records"></option><option value="users"></option>
        <option value="documents"></option><option value="trace"></option><option value="fees"></option><option value="audit"></option>
      </select>
    </header>
    <p id="banner"></p>
    <main>
      <p id="msg" class="muted"></p>
      <div id="view-root" style="display:grid;gap:16px"></div>
    </main>
  </div>
</div>
<div id="scrim"></div>
<aside id="drawer" aria-label="Details"><div class="top"><h2 id="drawer-title"></h2>
  <button class="secondary" id="drawer-close">Close ✕</button></div><div class="body" id="drawer-body"></div></aside>
<script>
const STATUSES = ["requested","identity_submitted","agreement_signed","identity_verified","attorney_assigned","filed","hearing_pending","approved","paid","denied","withdrawn"];
const STAGE = { requested: "Claim started", identity_submitted: "ID submitted", agreement_signed: "Agreement signed",
  identity_verified: "Waiting for attorney", attorney_assigned: "Attorney working", filed: "Filed", hearing_pending: "County / court",
  approved: "Approved", paid: "Money released", denied: "Denied", withdrawn: "Withdrawn" };
const TITLES = { overview: "Overview", insights: "Where people are", reviews: "Reviews", claims: "Claims", records: "County records",
  users: "People", trace: "Find owners", documents: "Signed documents", audit: "Audit trail", fees: "Fees and attorney pay" };
const URGENCY = { urgent: "60 days or less", soon: "2 to 6 months", safe: "over 6 months", expired: "deadline passed", unknown: "no fixed deadline", met: "filed in time" };
const URGENCY_COLOR = { urgent: "var(--urgent)", soon: "var(--soon)", safe: "var(--safe)", expired: "var(--expired)", unknown: "var(--muted)" };

const $ = (s) => document.querySelector(s);
const tokenInput = $("#token");
try { tokenInput.value = sessionStorage.getItem("surpay-admin") || ""; } catch {}
// The app's "Admin demo" button opens /admin#demo=<pass>. Take the pass, then clear it from the address bar.
const demoPass = (location.hash.match(/demo=([^&]+)/) || [])[1];
if (demoPass) { tokenInput.value = decodeURIComponent(demoPass); history.replaceState(null, "", location.pathname); }

function el(tag, attrs = {}, ...children) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const c of children.flat()) if (c != null && c !== false) n.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return n;
}
const money = (c) => "$" + ((c || 0) / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money0 = (c) => "$" + Math.round((c || 0) / 100).toLocaleString("en-US");
const when = (s) => s ? new Date(s).toLocaleString() : "";
const day = (s) => s ? new Date(s).toLocaleDateString() : "";
const kpi = (label, value, onclick) => el("div", { class: "kpi" + (onclick ? " click" : ""), onclick, title: onclick ? "Open" : null }, el("b", {}, value), el("span", {}, label));
const stage = (s) => el("span", { class: "stage" }, STAGE[s] || s);

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "X-Admin-Token": tokenInput.value, "Content-Type": "application/json", ...(opts.headers || {}) } });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r;
}
const getJson = async (path) => (await api(path)).json();

// ---- Sortable tables: click a header to sort; click a row to open its details. ----
function sortableTable(cols, rows, onRow, opts = {}) {
  let key = opts.sortKey || null, dir = opts.sortDir || -1;
  const wrap = el("div", { class: "tablewrap" });
  const draw = () => {
    const sorted = key ? [...rows].sort((a, b) => {
      const c = cols.find(c => c.key === key);
      const va = c.sort ? c.sort(a) : a[key], vb = c.sort ? c.sort(b) : b[key];
      if (va == null && vb == null) return 0; if (va == null) return 1; if (vb == null) return -1;
      return (typeof va === "number" && typeof vb === "number" ? va - vb : String(va).localeCompare(String(vb))) * dir;
    }) : rows;
    const head = el("tr", {}, ...cols.map(c => el("th", {
      class: (c.num ? "num " : "") + (c.nosort ? "" : "sort"), title: c.nosort ? null : "Sort",
      onclick: c.nosort ? null : () => { dir = key === c.key ? -dir : (c.num ? -1 : 1); key = c.key; draw(); },
    }, c.label, key === c.key ? el("span", { class: "dir" }, dir > 0 ? " ▲" : " ▼") : "")));
    const body = sorted.map(r => el("tr", { class: onRow ? "click" : "", onclick: onRow ? () => onRow(r) : null },
      ...cols.map(c => el("td", { class: c.num ? "num" : "" }, c.render ? c.render(r) : (r[c.key] ?? "")))));
    wrap.replaceChildren(el("table", {}, el("thead", {}, head), el("tbody", {}, ...(body.length ? body
      : [el("tr", {}, el("td", { colspan: cols.length, class: "muted" }, opts.empty || "Nothing here."))]))));
  };
  draw();
  return wrap;
}

// ---- Drawer with full details ----
function openDrawer(title, ...nodes) {
  $("#drawer-title").textContent = title;
  $("#drawer-body").replaceChildren(...nodes.flat().filter(Boolean));
  $("#drawer").classList.add("open"); $("#scrim").classList.add("open");
  $("#drawer").scrollTop = 0;
}
function closeDrawer() { $("#drawer").classList.remove("open"); $("#scrim").classList.remove("open"); }
$("#drawer-close").onclick = closeDrawer; $("#scrim").onclick = closeDrawer;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
const loading = () => el("p", { class: "muted" }, "Loading…");
const card = (title, ...kids) => el("section", { class: "card" }, title ? el("h2", {}, title) : null, ...kids);
const pairs = (obj) => el("div", { class: "grid" }, ...Object.entries(obj).filter(([, v]) => v != null && v !== "")
  .flatMap(([k, v]) => [el("div", {}, k), el("div", {}, v instanceof Node ? v : String(v))]));

function auditTable(entries) {
  return sortableTable([
    { key: "id", label: "#", num: true },
    { key: "at", label: "When", render: e => when(e.at) },
    { key: "action", label: "What" },
    { key: "actor_type", label: "Who", render: e => `${e.actor_type}${e.actor_id ? " " + e.actor_id : ""}` },
    { key: "entity_type", label: "On", render: e => e.entity_type ? `${e.entity_type} ${e.entity_id ?? ""}` : "" },
    { key: "ip", label: "IP / device", render: e => el("span", {}, e.ip || "–", el("div", { class: "muted" }, e.device_info || e.user_agent || "")) },
  ], entries, e => openDrawer(`Audit entry #${e.id}`, card("", pairs({ When: when(e.at), Action: e.action, Actor: `${e.actor_type} ${e.actor_id ?? ""}`,
    Entity: `${e.entity_type} ${e.entity_id ?? ""}`, IP: e.ip, Device: e.device_info, "Device id": e.device_id, "User agent": e.user_agent,
    "Chain hash": el("span", { class: "mono" }, e.hash) }), el("h3", {}, "Details"), el("pre", { class: "mono" }, JSON.stringify(e.details, null, 2)))),
    { sortKey: "id", sortDir: -1, empty: "No activity yet." });
}

// ---- Detail drawers ----
async function showClaim(id) {
  openDrawer(`Claim SP-${String(id).padStart(6, "0")}`, loading());
  try {
    const c = await getJson(`/admin/claims/${id}/detail`);
    const pay = c.pay || {};
    const p = c.provenance || {};
    openDrawer(`Claim ${c.reference_code} · ${c.user.full_name}`,
      card("At a glance", el("div", { class: "kpis" },
        kpi("amount", money(c.amount_cents)), kpi("stage", STAGE[c.status] || c.status),
        kpi("client fee", money(pay.client_fee_cents)), kpi("attorney pay", money(pay.total_cents)),
        kpi("Surpay keeps", money(pay.surpay_margin_cents))),
        pay.low_margin ? el("div", { class: "alert" }, "Low margin: Surpay keeps under 40% of the client's fee on this case.") : null,
        el("div", { class: "row", style: "margin-top:10px" }, clock(c.deadline),
          el("button", { class: "secondary", onclick: () => showUser(c.user.id) }, "Open claimant"),
          el("button", { class: "secondary", onclick: () => showRecord(c.record_id) }, "Open county record"))),
      card("Where this record came from", pairs({ Source: p.description || p.source, Publisher: p.publisher,
        "File type": p.file_type, "County file": p.file_url ? el("a", { href: p.file_url, target: "_blank", rel: "noopener" }, "Open the county's list") : "",
        "First seen": when(p.first_seen), "Last seen": when(p.last_seen) })),
      (c.signed_documents || []).length ? card("Signed documents", ...c.signed_documents.map(docRow)) : null,
      render(c),
      card("Activity on this claim", auditTable(c.activity || [])));
  } catch (e) { openDrawer("Claim", el("p", {}, e.message)); }
}

async function showRecord(id) {
  openDrawer("County record", loading());
  try {
    const r = await getJson(`/admin/records/${id}`);
    const p = r.provenance, f = r.filing_method || {};
    openDrawer(`${r.owner_name} · ${money(r.amount_cents)}`,
      card("Record", pairs({ County: `${r.county} County, ${r.state}`, Reference: r.reference, "Listed owner": r.owner_name,
        "Owner address": r.owner_address, Amount: money(r.amount_cents), "Sale type": r.sale_type.replace(/_/g, " "),
        "Sale date": r.sale_date || "not in the list", Status: r.status, "Time left": clock(r.deadline) || "" }),
        r.deadline ? el("p", { class: "muted" }, r.deadline.message) : null),
      card("", el("div", { class: "row" }, el("button", { onclick: () => showTrace(r.id) }, "Find the owner"))),
      card("Where it came from", pairs({ Source: `${p.description} (${p.source})`, Publisher: p.publisher,
        "File type": p.file_type, "County file": p.file_url ? el("a", { href: p.file_url, target: "_blank", rel: "noopener" }, p.file_url) : "",
        "List page": p.list_page ? el("a", { href: p.list_page, target: "_blank", rel: "noopener" }, p.list_page) : "",
        "Updated": p.update_frequency, "Key in that list": el("span", { class: "mono" }, p.source_key),
        "First seen": when(p.first_seen), "Last seen": when(p.last_seen), "Last successful scrape": when(p.last_successful_run),
        Notes: p.registry_notes }),
        el("h3", {}, "Each field as read from the county's file"),
        sortableTable([{ key: "k", label: "Column" }, { key: "v", label: "Value", render: x => el("span", { class: "mono" }, x.v) }],
          Object.entries(r.raw || {}).map(([k, v]) => ({ k, v: typeof v === "string" ? v : JSON.stringify(v) })), null, { empty: "No raw fields kept." })),
      card("How it's filed", pairs({ Kind: f.kind, Method: f.method, Where: f.where, Address: f.address, Notarized: f.notarized,
        Fee: f.fee, "Who may file": f.who_may_file, Processing: f.processing, Notes: f.notes }),
        ...(f.forms || []).map(x => el("div", {}, el("a", { href: x.url, target: "_blank", rel: "noopener" }, x.name)))),
      card(`Claims on this record (${r.claims.length})`, sortableTable([
        { key: "ref", label: "Claim" }, { key: "claimant", label: "Claimant" }, { key: "status", label: "Stage", render: x => stage(x.status) }],
        r.claims, x => showClaim(x.id), { empty: "No one has claimed it yet." })));
  } catch (e) { openDrawer("County record", el("p", {}, e.message)); }
}

async function showUser(id) {
  openDrawer("Person", loading());
  try {
    const u = await getJson(`/admin/users/${id}`);
    const suspend = async (decision) => {
      const note = decision === "rejected" ? prompt(`Suspend ${u.email}? Reason (kept in the audit log):`) : "";
      if (decision === "rejected" && !note) return;
      try { await api(`/admin/users/${u.id}/suspend`, { method: "POST", body: JSON.stringify({ decision, note }) }); showUser(id); }
      catch (e) { alert(e.message); }
    };
    openDrawer(`${u.name} · ${u.app_number}`,
      card("Account", pairs({ "App number": el("b", {}, u.app_number), Email: u.email, Phone: u.phone, Role: u.role, Joined: u.created,
        "ID check": u.identity || "not submitted", "Email confirmed": when(u.email_verified_at) || "not yet",
        "Phone confirmed": when(u.phone_verified_at) || "not yet",
        Attorney: u.attorney ? `${u.attorney.status} · ${u.attorney.bar} · ${u.attorney.counties.join(", ")}${u.attorney.available ? "" : " · paused"}` : "",
        Homes: u.addresses.join(" · ") }),

  const inp = (ph, v, w) => el("input", { placeholder: ph, value: v, style: `width:${w}` });
  const qIn = inp("Owner name or reference", "", "220px"), stIn = inp("State", recState, "70px"), coIn = inp("County", recCounty, "130px"), minIn = inp("Min $", "", "90px");
  const sel = (opts, v) => el("select", {}, ...opts.map(([k, t]) => el("option", { value: k, selected: k === v ? "" : null }, t)));
  const urg = sel([["", "Any deadline"], ["urgent", "60 days or less"], ["soon", "2 to 6 months"], ["safe", "Over 6 months"], ["expired", "Deadline passed"], ["unknown", "No fixed deadline"]], recUrgency);
  const st = sel([["listed", "Listed"], ["delisted", "No longer listed"], ["", "All"]], "listed");
  const holder = el("div");
  const params = () => new URLSearchParams({ q: qIn.value, state: stIn.value, county: coIn.value, min_cents: Math.round((Number(minIn.value) || 0) * 100),

    recUrgency = urg.value; recState = stIn.value; recCounty = coIn.value;

    let rows = d.records;

      el("div", { class: "row", style: "justify-content:space-between" },
        el("span", { class: "muted" }, `${d.total.toLocaleString()} records${recSource ? " from " + recSource : ""} · page ${d.page} of ${pages} · sorted server-side by `,
          sel([["amount", "largest amount"], ["deadline", "closest deadline"], ["newest", "newest"], ["sale_date", "oldest sale"], ["owner", "owner A-Z"]], recSort)),
        el("span", { class: "row" },
          el("button", { class: "secondary", onclick: () => { if (recPage > 1) { recPage--; draw(); } } }, "‹ Previous"),

      ], rows, r => showRecord(r.id), { empty: "No records match." }));

async function loadImage(img, userId, kind, path) {
  try {

    const sig = el("img", { alt: "signature", title: "Drawn signature", style: "width:220px;height:80px;object-fit:contain;background:#fff" });
    if (a.has_signature_image) loadImage(sig, null, null, `/admin/claims/${c.id}/signature`);
    const ev = el("pre", { class: "muted", style: "white-space:pre-wrap;display:none" });
    card.append(el("h3", {}, "Agreement and signing evidence"),
      el("div", { class: "grid" },
        el("div", {}, "Typed name"), el("div", {}, `${a.signature_name} (ID: ${a.legal_name_on_id || "?"})`),
        el("div", {}, "Signed"), el("div", {}, `${when(a.signed_at)} · version ${a.version}`),
        el("div", {}, "IP / device"), el("div", {}, `${a.ip_address || "?"} · ${a.device || "?"} · ${a.device_id || "?"}`),
        el("div", {}, "SHA-256"), el("div", { style: "word-break:break-all" }, a.document_sha256 || "—")),
      el("div", { class: "docs" }, sig),
      el("div", { class: "row" },
        el("button", { class: "secondary", onclick: async () => {
          try { ev.textContent = JSON.stringify(await (await api(`/admin/claims/${c.id}/evidence`)).json(), null, 2); ev.style.display = "block"; }
          catch (e) { alert(e.message); } } }, "Show evidence certificate"),
        c.messages ? el("button", { class: "secondary", onclick: async () => {
          if (!confirm("Messages are private. Open them only for a dispute or misuse report. This is logged.")) return;
          try { ev.textContent = (await (await api(`/admin/claims/${c.id}/messages`)).json()).map(m => `[${when(m.created_at)}] ${m.sender_role}: ${m.body}`).join("\n"); ev.style.display = "block"; }
          catch (e) { alert(e.message); } } }, `Messages (${c.messages})`) : null),
      ev);
  }
  const at = c.attorney;
  card.append(el("h3", {}, "Attorney"),
    at ? el("div", { class: "row" },
        el("span", {}, `${at.name}${at.firm ? " · " + at.firm : ""}`),
        el("span", { class: "pill" }, at.assignment_status),
        el("span", { class: "pill " + (at.payout_status === "paid" ? "approved" : at.payout_status === "due" ? "pending" : "") },
          `fee ${money(at.fee_cents)} ${at.payout_status || "not due"}`))
       : el("div", { class: "muted" }, c.status === "identity_verified" ? "No attorney serves this county yet. Recruit one, then press Offer." : "Assigned once ID is verified and the agreement signed."),
    el("div", { class: "row" },
      el("button", { class: "secondary", onclick: () => claimAction(c, "reassign", `Offer claim #${c.id} to ${at ? "the next" : "an"} attorney?`) }, at ? "Reassign" : "Offer to attorney"),
      ...(at && at.payout_status === "due" ? [el("button", { onclick: () => claimAction(c, "payout", `Mark ${money(at.fee_cents)} paid to ${at.name}?`) }, "Mark attorney paid")] : [])));

  const sel = el("select", {}, ...STATUSES.map(s => { const o = el("option", { value: s }, s); if (s === c.status) o.selected = true; return o; }));
  const note = el("input", { placeholder: "Note (shown in history)" });
  card.append(
    el("h3", {}, "Move claim"),
    el("div", { class: "row" }, sel, note, el("button", { class: "secondary", onclick: () => setStatus(c, sel.value, note.value) }, "Update status")),
    el("h3", {}, "History"),
    el("ol", {}, ...c.history.map(h => el("li", {}, `${h.status} · ${when(h.at)}${h.note ? " · " + h.note : ""}`))),
  );
  return card;
}

async function review(c, decision) {
  const note = decision === "rejected" ? prompt("Why? The claimant sees this note.") : "";
  if (decision === "rejected" && !note) return;
  try { await api(`/admin/users/${c.user.id}/identity`, { method: "POST", body: JSON.stringify({ decision, note }) }); load(); }
  catch (e) { alert(e.message); }
}

async function setStatus(c, status, note) {
  if (!confirm(`Set claim #${c.id} to "${status}"?`)) return;
  try { await api(`/admin/claims/${c.id}/status`, { method: "POST", body: JSON.stringify({ status, note }) }); load(); }
  catch (e) { alert(e.message); }
}

function renderIdentity(p) {
  const id = p.identity, u = p.user;
  const docs = el("div", { class: "docs" });
  for (const kind of ["id_front", ...(id.has_id_back ? ["id_back"] : []), "selfie"]) {
    const img = el("img", { alt: kind, title: kind });
    docs.append(img);
    loadImage(img, u.id, kind);
  }
  const c = { user: u };
  return el("section", { class: "card" },
    el("div", { class: "row" }, el("h2", {}, `ID review · ${id.legal_name}`), el("span", { class: "pill pending" }, "waiting"),
      el("span", { class: "pill" }, `${p.possible_matches} possible match${p.possible_matches === 1 ? "" : "es"}`)),
    el("div", { class: "muted" }, `${u.email} · submitted ${when(id.submitted_at)}`),
    ...(p.possible_duplicates && p.possible_duplicates.length ? [el("p", { class: "pill rejected" },
      `Same date of birth and name or SSN digits as: ${p.possible_duplicates.join(", ")}. Check it isn't a second account or someone else's ID.`)] : []),
    el("div", { class: "grid" },
      el("div", {}, "Legal name"), el("div", {}, id.legal_name),
      el("div", {}, "Other names"), el("div", {}, u.other_names.join(", ") || "—"),
      el("div", {}, "Date of birth"), el("div", {}, id.date_of_birth),
      el("div", {}, "SSN last 4"), el("div", {}, id.ssn_last4),
      el("div", {}, "Phone"), el("div", {}, id.phone),
      el("div", {}, "Current address"), el("div", {}, id.address),
      el("div", {}, "ID type"), el("div", {}, id.id_type.replace("_", " "))),
    el("h3", {}, "Homes they listed"),
    el("ol", {}, ...u.addresses.map(a => el("li", {}, `${a.street}, ${a.city}, ${a.state} ${a.zip} (${a.county || "county not given"})`))),
    docs,
    el("p", { class: "muted" }, "Check the photo matches the selfie, the name and date of birth match the ID, and nothing looks edited."),
    el("div", { class: "row" },
      el("button", { onclick: () => review(c, "approved") }, "Approve ID"),
      el("button", { class: "danger", onclick: () => review(c, "rejected") }, "Reject (ask to resubmit)")),
  );
}

function renderAttorney(a) {
  const img = el("img", { alt: "bar card", title: "Bar card" });
  (async () => {
    try { img.src = URL.createObjectURL(await (await api(`/admin/attorneys/${a.user_id}/bar-card`)).blob()); img.onclick = () => window.open(img.src, "_blank"); }
    catch { img.alt = "Not available"; }
  })();
  const search = `https://www.google.com/search?q=${encodeURIComponent(a.bar_state + " state bar attorney search " + a.full_name + " " + a.bar_number)}`;
  return el("section", { class: "card" },
    el("div", { class: "row" }, el("h2", {}, `Attorney application · ${a.full_name}`), el("span", { class: "pill pending" }, a.status)),
    el("div", { class: "muted" }, `${a.email} · applied ${when(a.applied_at)}`),
    el("div", { class: "grid" },
      el("div", {}, "Bar"), el("div", {}, `${a.bar_state} #${a.bar_number}`),
      el("div", {}, "Firm"), el("div", {}, a.firm || "—"),
      el("div", {}, "Phone"), el("div", {}, a.phone),
      el("div", {}, "Office"), el("div", {}, a.office_address),
      el("div", {}, "Counties"), el("div", {}, a.counties.join(", "))),
    el("div", { class: "docs" }, img),
    el("p", { class: "muted" }, "Confirm the license is active on the state bar's official directory before approving. ",
      el("a", { href: search, target: "_blank", rel: "noopener" }, "Find the bar directory")),
    el("div", { class: "row" },
      el("button", { onclick: () => reviewAttorney(a, "approved") }, "Approve attorney"),
      el("button", { class: "danger", onclick: () => reviewAttorney(a, "rejected") }, "Reject")),
  );
}

async function reviewAttorney(a, decision) {
  const note = decision === "rejected" ? prompt("Why? The attorney sees this note.") : "";
  if (decision === "rejected" && !note) return;
  try {
    const r = await (await api(`/admin/attorneys/${a.user_id}`, { method: "POST", body: JSON.stringify({ decision, note }) })).json();
    if (decision === "approved") alert(`Approved. ${r.cases_offered} waiting case(s) offered to them.`);
    load();
  } catch (e) { alert(e.message); }
}

async function overrideFee(c, pct) {
  const note = prompt(`Set claim #${c.id} fee to ${pct}%? Reason (kept in the audit log):`);
  if (note === null) return;
  try { await api(`/admin/claims/${c.id}/fee`, { method: "POST", body: JSON.stringify({ fee_pct: Number(pct), note }) }); load(); }
  catch (e) { alert(e.message); }
}

function renderRelative(r) {
  const docs = el("div", { class: "docs" });
  for (const kind of r.documents) {
    const img = el("img", { alt: kind, title: kind.replace(/_/g, " ") });
    docs.append(img);
    loadImage(img, null, null, `/admin/relatives/${r.id}/documents/${kind}`);
  }
  const decide = async (decision) => {
    const note = decision === "rejected" ? prompt("What's missing? The user sees this note.") : "";
    if (decision === "rejected" && !note) return;
    try { await api(`/admin/relatives/${r.id}`, { method: "POST", body: JSON.stringify({ decision, note }) }); load(); }
    catch (e) { alert(e.message); }
  };
  return el("section", { class: "card" },
    el("div", { class: "row" }, el("h2", {}, `Family claim · ${r.full_name}`), el("span", { class: "pill pending" }, "waiting"),
      el("span", { class: "pill" }, `${r.possible_matches} possible match${r.possible_matches === 1 ? "" : "es"}`)),
    el("div", { class: "muted" }, `Requested by ${r.user.verified_name} (${r.user.email}, ID ${r.user.identity_status}) · ${when(r.submitted_at)}`),
    el("div", { class: "grid" },
      el("div", {}, "Relationship"), el("div", {}, r.relationship),
      el("div", {}, "Basis"), el("div", {}, r.basis.replace(/_/g, " ")),
      el("div", {}, "Date of death"), el("div", {}, r.date_of_death || "—"),
      el("div", {}, "Other names"), el("div", {}, r.other_names.join(", ") || "—")),
    el("h3", {}, "Their homes"),
    el("ol", {}, ...r.addresses.map(a => el("li", {}, `${a.street}, ${a.city}, ${a.state} ${a.zip} (${a.county})`))),
    docs,
    el("p", { class: "muted" }, "Check the documents link the requester to this person (birth/marriage certificates), the death certificate or authority document is genuine, and the names match."),
    el("div", { class: "row" },
      el("button", { onclick: () => decide("approved") }, "Approve"),
      el("button", { class: "danger", onclick: () => decide("rejected") }, "Reject (ask for documents)")));
}

async function download(path, name) {
  try {
    const blob = await (await api(path)).blob();
    const a = el("a", { href: URL.createObjectURL(blob), download: name });
    document.body.append(a); a.click(); a.remove();
  } catch (e) { alert(e.message); }
}

async function claimAction(c, path, msg) {
  if (!confirm(msg)) return;
  try { await api(`/admin/claims/${c.id}/${path}`, { method: "POST" }); load(); } catch (e) { alert(e.message); }
}

</script>
</body>
</html>
