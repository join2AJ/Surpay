<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Surpay Review</title>
<style>
  :root { --bg:#f5f7fb; --card:#fff; --text:#0f172a; --muted:#5b6474; --line:#e3e8f0; --brand:#0b6e4f; --warn:#8a5a00; --bad:#b42318; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b1120; --card:#131c2e; --text:#e6eaf2; --muted:#9aa4b5; --line:#23304a; --brand:#34c38f; --warn:#f2c26b; --bad:#ff8a80; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
  header { padding:16px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; }
  header h1 { font-size:18px; margin:0 auto 0 0; }
  input, select, button, textarea { font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); }
  button { background:var(--brand); color:#fff; border:0; font-weight:600; cursor:pointer; }
  button.secondary { background:transparent; color:var(--text); border:1px solid var(--line); }
  button.danger { background:var(--bad); }
  main:empty { display:none; }
  main { padding:16px; max-width:900px; margin:0 auto; display:grid; gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .muted { color:var(--muted); font-size:13px; }
  .pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600; border:1px solid var(--line); }
  .pill.pending { color:var(--warn); } .pill.approved { color:var(--brand); } .pill.rejected { color:var(--bad); }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:4px 16px; margin:8px 0; }
  .grid div:nth-child(odd) { color:var(--muted); font-size:13px; }
  .docs { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; }
  .docs img { width:150px; height:110px; object-fit:cover; border-radius:8px; border:1px solid var(--line); cursor:zoom-in; }
  h2 { font-size:17px; margin:0; }
  h3 { font-size:14px; margin:12px 0 4px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  ol { margin:4px 0; padding-left:20px; }
  #msg { padding:0 16px; }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } .grid div:nth-child(odd) { margin-top:6px; } }
</style>
</head>
<body>
<header>
  <h1>Surpay staff review</h1>
  <input id="token" type="password" placeholder="Admin token" autocomplete="off">
  <button id="load">Load</button>
  <select id="view">
    <option value="reviews">Reviews (attorneys, IDs, family)</option>
    <option value="claims">Claims</option>
    <option value="fees">Fee rules</option>
    <option value="audit">Audit trail</option>
  </select>
  <select id="filter">
    <option value="">All claims</option>
    <option value="identity_submitted,agreement_signed">Needs ID review</option>
    <option value="identity_verified,attorney_assigned,filed,hearing_pending,approved">In progress</option>
    <option value="paid,denied,withdrawn">Closed</option>
  </select>
</header>
<p id="banner" style="display:none;margin:0;padding:10px 16px;background:#fff1d6;color:#6b4a00;font-weight:600"></p>
<p id="msg" class="muted"></p>
<main id="lawyers"></main>
<main id="pending"></main>
<main id="relatives"></main>
<main id="list"></main>
<main id="fees"></main>
<main id="audit"></main>

<script>
const STATUSES = ["requested","identity_submitted","agreement_signed","identity_verified","attorney_assigned","filed","hearing_pending","approved","paid","denied","withdrawn"];
const $ = (s) => document.querySelector(s);
const tokenInput = $("#token");
try { tokenInput.value = sessionStorage.getItem("surpay-admin") || ""; } catch {}
// The app's "Admin demo" button opens /admin#demo=<pass>. Take the pass, then clear it from the address bar.
const demoPass = (location.hash.match(/demo=([^&]+)/) || [])[1];
if (demoPass) { tokenInput.value = decodeURIComponent(demoPass); history.replaceState(null, "", location.pathname); }

function el(tag, attrs = {}, ...children) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const c of children) if (c != null) n.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return n;
}
const money = (c) => "$" + (c / 100).toLocaleString("en-US", { minimumFractionDigits: 2 });
const when = (s) => s ? new Date(s).toLocaleString() : "";

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "X-Admin-Token": tokenInput.value, "Content-Type": "application/json", ...(opts.headers || {}) } });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r;
}

async function loadImage(img, userId, kind, path) {
  try {
    const blob = await (await api(path || `/admin/users/${userId}/documents/${kind}`)).blob();
    img.src = URL.createObjectURL(blob);
    img.onclick = () => window.open(img.src, "_blank");
  } catch (e) { img.alt = "Not available"; }
}

function render(c) {
  const id = c.identity;
  const card = el("section", { class: "card" });
  card.append(
    el("div", { class: "row" },
      el("h2", {}, `#${c.id} · ${c.user.full_name}`),
      el("span", { class: "pill" }, c.status),
      id ? el("span", { class: "pill " + id.review_status }, "ID " + id.review_status) : el("span", { class: "pill" }, "no ID yet")),
    el("div", { class: "muted" }, `${c.user.email} · ${c.user.phone || "no phone"}`),
    ...(c.relative ? [el("div", { class: "pill " + c.relative.review_status }, `Family claim: for ${c.relative.name} (${c.relative.relationship}, ${c.relative.basis.replace(/_/g, " ")})`)] : []),
    el("h3", {}, "County record"),
    el("div", { class: "grid" },
      el("div", {}, "County"), el("div", {}, `${c.county} County, ${c.state} · ${c.reference}`),
      el("div", {}, "Listed owner"), el("div", {}, c.owner_name),
      el("div", {}, "Address on record"), el("div", {}, c.owner_address || "—"),
      el("div", {}, "Amount"), el("div", {}, money(c.amount_cents))),
    ...(c.other_claimants ? [el("p", { class: "pill pending" }, `${c.other_claimants} other account(s) also claim this record: co-owner, other heir, or a false claim.`)] : []),
    ...(c.record_listed === false ? [el("p", { class: "pill rejected" }, "The county no longer lists this record. Check whether it was paid out.")] : []),
    el("h3", {}, "Homes the claimant listed"),
    el("ol", {}, ...c.user.addresses.map(a => el("li", {}, `${a.street}, ${a.city}, ${a.state} ${a.zip} (${a.county || "county not given"})`))),
  );
  if (id) {
    const docs = el("div", { class: "docs" });
    for (const kind of ["id_front", ...(id.has_id_back ? ["id_back"] : []), "selfie"]) {
      const img = el("img", { alt: kind, title: kind });
      docs.append(img);
      loadImage(img, c.user.id, kind);
    }
    card.append(
      el("h3", {}, "Identity submitted " + when(id.submitted_at)),
      el("div", { class: "grid" },
        el("div", {}, "Legal name"), el("div", {}, id.legal_name),
        el("div", {}, "Date of birth"), el("div", {}, id.date_of_birth),
        el("div", {}, "SSN last 4"), el("div", {}, id.ssn_last4),
        el("div", {}, "Current address"), el("div", {}, id.address),
        el("div", {}, "ID type"), el("div", {}, id.id_type.replace("_", " "))),
      docs,
      el("div", { class: "row" },
        el("button", { onclick: () => review(c, "approved") }, "Approve ID"),
        el("button", { class: "danger", onclick: () => review(c, "rejected") }, "Reject ID (ask to resubmit)")),
    );
  }
  const fb = c.fee_basis || {};
  const feeIn = el("input", { type: "number", step: "0.5", min: "0", max: "50", value: c.fee_pct, style: "width:90px" });
  card.append(el("h3", {}, "Fee"),
    el("div", { class: "muted" }, `${c.fee_pct}% · county rate ${fb.county_pct ?? "?"}% (${fb.county_pct_from || "?"}), amount band ${fb.amount_band_pct ?? "?"}%, legal max ${fb.legal_max_pct ?? "none set"}${fb.override ? " · set by staff: " + (fb.override_note || "") : ""}`),
    c.agreement ? el("div", { class: "muted" }, "Fixed: the client signed at this fee.")
      : el("div", { class: "row" }, feeIn, el("button", { class: "secondary", onclick: () => overrideFee(c, feeIn.value) }, "Set fee for this case")));
  if (c.agreement) {
    const a = c.agreement;
    const sig = el("img", { alt: "signature", title: "Drawn signature", style: "width:220px;height:80px;object-fit:contain;background:#fff" });
    if (a.has_signature_image) loadImage(sig, null, null, `/admin/claims/${c.id}/signature`);
    const ev = el("pre", { class: "muted", style: "white-space:pre-wrap;display:none" });
    card.append(el("h3", {}, "Agreement and signing evidence"),
      el("div", { class: "grid" },
        el("div", {}, "Typed name"), el("div", {}, `${a.signature_name} (ID: ${a.legal_name_on_id || "?"})`),
        el("div", {}, "Signed"), el("div", {}, `${when(a.signed_at)} · version ${a.version}`),
        el("div", {}, "IP / device"), el("div", {}, `${a.ip_address || "?"} · ${a.device || "?"} · ${a.device_id || "?"}`),
        el("div", {}, "SHA-256"), el("div", { style: "word-break:break-all" }, a.document_sha256 || "—")),
      el("div", { class: "docs" }, sig),
      el("div", { class: "row" },
        el("button", { class: "secondary", onclick: async () => {
          try { ev.textContent = JSON.stringify(await (await api(`/admin/claims/${c.id}/evidence`)).json(), null, 2); ev.style.display = "block"; }
          catch (e) { alert(e.message); } } }, "Show evidence certificate"),
        c.messages ? el("button", { class: "secondary", onclick: async () => {
          if (!confirm("Messages are private. Open them only for a dispute or misuse report. This is logged.")) return;
          try { ev.textContent = (await (await api(`/admin/claims/${c.id}/messages`)).json()).map(m => `[${when(m.created_at)}] ${m.sender_role}: ${m.body}`).join("\n"); ev.style.display = "block"; }
          catch (e) { alert(e.message); } } }, `Messages (${c.messages})`) : null),
      ev);
  }
  const at = c.attorney;
  card.append(el("h3", {}, "Attorney"),
    at ? el("div", { class: "row" },
        el("span", {}, `${at.name}${at.firm ? " · " + at.firm : ""}`),
        el("span", { class: "pill" }, at.assignment_status),
        el("span", { class: "pill " + (at.payout_status === "paid" ? "approved" : at.payout_status === "due" ? "pending" : "") },
          `fee ${money(at.fee_cents)} ${at.payout_status || "not due"}`))
       : el("div", { class: "muted" }, c.status === "identity_verified" ? "No attorney serves this county yet. Recruit one, then press Offer." : "Assigned once ID is verified and the agreement signed."),
    el("div", { class: "row" },
      el("button", { class: "secondary", onclick: () => claimAction(c, "reassign", `Offer claim #${c.id} to ${at ? "the next" : "an"} attorney?`) }, at ? "Reassign" : "Offer to attorney"),
      ...(at && at.payout_status === "due" ? [el("button", { onclick: () => claimAction(c, "payout", `Mark ${money(at.fee_cents)} paid to ${at.name}?`) }, "Mark attorney paid")] : [])));

  const sel = el("select", {}, ...STATUSES.map(s => { const o = el("option", { value: s }, s); if (s === c.status) o.selected = true; return o; }));
  const note = el("input", { placeholder: "Note (shown in history)" });
  card.append(
    el("h3", {}, "Move claim"),
    el("div", { class: "row" }, sel, note, el("button", { class: "secondary", onclick: () => setStatus(c, sel.value, note.value) }, "Update status")),
    el("h3", {}, "History"),
    el("ol", {}, ...c.history.map(h => el("li", {}, `${h.status} · ${when(h.at)}${h.note ? " · " + h.note : ""}`))),
  );
  return card;
}

async function review(c, decision) {
  const note = decision === "rejected" ? prompt("Why? The claimant sees this note.") : "";
  if (decision === "rejected" && !note) return;
  try { await api(`/admin/users/${c.user.id}/identity`, { method: "POST", body: JSON.stringify({ decision, note }) }); load(); }
  catch (e) { alert(e.message); }
}

async function setStatus(c, status, note) {
  if (!confirm(`Set claim #${c.id} to "${status}"?`)) return;
  try { await api(`/admin/claims/${c.id}/status`, { method: "POST", body: JSON.stringify({ status, note }) }); load(); }
  catch (e) { alert(e.message); }
}

function renderIdentity(p) {
  const id = p.identity, u = p.user;
  const docs = el("div", { class: "docs" });
  for (const kind of ["id_front", ...(id.has_id_back ? ["id_back"] : []), "selfie"]) {
    const img = el("img", { alt: kind, title: kind });
    docs.append(img);
    loadImage(img, u.id, kind);
  }
  const c = { user: u };
  return el("section", { class: "card" },
    el("div", { class: "row" }, el("h2", {}, `ID review · ${id.legal_name}`), el("span", { class: "pill pending" }, "waiting"),
      el("span", { class: "pill" }, `${p.possible_matches} possible match${p.possible_matches === 1 ? "" : "es"}`)),
    el("div", { class: "muted" }, `${u.email} · submitted ${when(id.submitted_at)}`),
    ...(p.possible_duplicates && p.possible_duplicates.length ? [el("p", { class: "pill rejected" },
      `Same date of birth and name or SSN digits as: ${p.possible_duplicates.join(", ")}. Check it isn't a second account or someone else's ID.`)] : []),
    el("div", { class: "grid" },
      el("div", {}, "Legal name"), el("div", {}, id.legal_name),
      el("div", {}, "Other names"), el("div", {}, u.other_names.join(", ") || "—"),
      el("div", {}, "Date of birth"), el("div", {}, id.date_of_birth),
      el("div", {}, "SSN last 4"), el("div", {}, id.ssn_last4),
      el("div", {}, "Phone"), el("div", {}, id.phone),
      el("div", {}, "Current address"), el("div", {}, id.address),
      el("div", {}, "ID type"), el("div", {}, id.id_type.replace("_", " "))),
    el("h3", {}, "Homes they listed"),
    el("ol", {}, ...u.addresses.map(a => el("li", {}, `${a.street}, ${a.city}, ${a.state} ${a.zip} (${a.county || "county not given"})`))),
    docs,
    el("p", { class: "muted" }, "Check the photo matches the selfie, the name and date of birth match the ID, and nothing looks edited."),
    el("div", { class: "row" },
      el("button", { onclick: () => review(c, "approved") }, "Approve ID"),
      el("button", { class: "danger", onclick: () => review(c, "rejected") }, "Reject (ask to resubmit)")),
  );
}

function renderAttorney(a) {
  const img = el("img", { alt: "bar card", title: "Bar card" });
  (async () => {
    try { img.src = URL.createObjectURL(await (await api(`/admin/attorneys/${a.user_id}/bar-card`)).blob()); img.onclick = () => window.open(img.src, "_blank"); }
    catch { img.alt = "Not available"; }
  })();
  const search = `https://www.google.com/search?q=${encodeURIComponent(a.bar_state + " state bar attorney search " + a.full_name + " " + a.bar_number)}`;
  return el("section", { class: "card" },
    el("div", { class: "row" }, el("h2", {}, `Attorney application · ${a.full_name}`), el("span", { class: "pill pending" }, a.status)),
    el("div", { class: "muted" }, `${a.email} · applied ${when(a.applied_at)}`),
    el("div", { class: "grid" },
      el("div", {}, "Bar"), el("div", {}, `${a.bar_state} #${a.bar_number}`),
      el("div", {}, "Firm"), el("div", {}, a.firm || "—"),
      el("div", {}, "Phone"), el("div", {}, a.phone),
      el("div", {}, "Office"), el("div", {}, a.office_address),
      el("div", {}, "Counties"), el("div", {}, a.counties.join(", "))),
    el("div", { class: "docs" }, img),
    el("p", { class: "muted" }, "Confirm the license is active on the state bar's official directory before approving. ",
      el("a", { href: search, target: "_blank", rel: "noopener" }, "Find the bar directory")),
    el("div", { class: "row" },
      el("button", { onclick: () => reviewAttorney(a, "approved") }, "Approve attorney"),
      el("button", { class: "danger", onclick: () => reviewAttorney(a, "rejected") }, "Reject")),
  );
}

async function reviewAttorney(a, decision) {
  const note = decision === "rejected" ? prompt("Why? The attorney sees this note.") : "";
  if (decision === "rejected" && !note) return;
  try {
    const r = await (await api(`/admin/attorneys/${a.user_id}`, { method: "POST", body: JSON.stringify({ decision, note }) })).json();
    if (decision === "approved") alert(`Approved. ${r.cases_offered} waiting case(s) offered to them.`);
    load();
  } catch (e) { alert(e.message); }
}

async function overrideFee(c, pct) {
  const note = prompt(`Set claim #${c.id} fee to ${pct}%? Reason (kept in the audit log):`);
  if (note === null) return;
  try { await api(`/admin/claims/${c.id}/fee`, { method: "POST", body: JSON.stringify({ fee_pct: Number(pct), note }) }); load(); }
  catch (e) { alert(e.message); }
}

function renderRelative(r) {
  const docs = el("div", { class: "docs" });
  for (const kind of r.documents) {
    const img = el("img", { alt: kind, title: kind.replace(/_/g, " ") });
    docs.append(img);
    loadImage(img, null, null, `/admin/relatives/${r.id}/documents/${kind}`);
  }
  const decide = async (decision) => {
    const note = decision === "rejected" ? prompt("What's missing? The user sees this note.") : "";
    if (decision === "rejected" && !note) return;
    try { await api(`/admin/relatives/${r.id}`, { method: "POST", body: JSON.stringify({ decision, note }) }); load(); }
    catch (e) { alert(e.message); }
  };
  return el("section", { class: "card" },
    el("div", { class: "row" }, el("h2", {}, `Family claim · ${r.full_name}`), el("span", { class: "pill pending" }, "waiting"),
      el("span", { class: "pill" }, `${r.possible_matches} possible match${r.possible_matches === 1 ? "" : "es"}`)),
    el("div", { class: "muted" }, `Requested by ${r.user.verified_name} (${r.user.email}, ID ${r.user.identity_status}) · ${when(r.submitted_at)}`),
    el("div", { class: "grid" },
      el("div", {}, "Relationship"), el("div", {}, r.relationship),
      el("div", {}, "Basis"), el("div", {}, r.basis.replace(/_/g, " ")),
      el("div", {}, "Date of death"), el("div", {}, r.date_of_death || "—"),
      el("div", {}, "Other names"), el("div", {}, r.other_names.join(", ") || "—")),
    el("h3", {}, "Their homes"),
    el("ol", {}, ...r.addresses.map(a => el("li", {}, `${a.street}, ${a.city}, ${a.state} ${a.zip} (${a.county})`))),
    docs,
    el("p", { class: "muted" }, "Check the documents link the requester to this person (birth/marriage certificates), the death certificate or authority document is genuine, and the names match."),
    el("div", { class: "row" },
      el("button", { onclick: () => decide("approved") }, "Approve"),
      el("button", { class: "danger", onclick: () => decide("rejected") }, "Reject (ask for documents)")));
}

async function loadFees() {
  const f = await (await api("/admin/fees")).json();
  const state = el("input", { placeholder: "State (OH)", maxlength: "2", style: "width:90px" });
  const county = el("input", { placeholder: "County (blank = whole state)" });
  const base = el("input", { type: "number", step: "0.5", placeholder: "Usual %", style: "width:100px" });
  const cap = el("input", { type: "number", step: "0.5", placeholder: "Legal max %", style: "width:110px" });
  const source = el("input", { placeholder: "Law / source for the max" });
  const num = (i) => i.value === "" ? null : Number(i.value);
  const save = async () => {
    try { await api("/admin/fees/rules", { method: "POST", body: JSON.stringify({ state: state.value, county: county.value, base_pct: num(base), legal_max_pct: num(cap), legal_source: source.value }) }); loadFees(); }
    catch (e) { alert(e.message); }
  };
  const bands = el("textarea", { rows: "5", style: "width:100%;font-family:monospace" });
  bands.value = f.bands.map(b => `${b.up_to_cents == null ? "above" : b.up_to_cents / 100} ${b.pct}`).join("\n");
  const saveBands = async () => {
    const parsed = bands.value.trim().split(/\n+/).map(l => { const [a, p] = l.trim().split(/\s+/); return { up_to_cents: a === "above" ? null : Math.round(Number(a) * 100), pct: Number(p) }; });
    try { await api("/admin/fees/bands", { method: "PUT", body: JSON.stringify({ bands: parsed }) }); loadFees(); } catch (e) { alert(e.message); }
  };
  $("#fees").replaceChildren(
    el("section", { class: "card" }, el("h2", {}, "How fees are set"),
      el("p", { class: "muted" }, `${f.formula}. Default usual rate: ${f.default_pct}%. Users only see the final percentage.`),
      el("h3", {}, "Amount bands (amount in dollars, then %; last line 'above')"), bands,
      el("div", { class: "row" }, el("button", { onclick: saveBands }, "Save bands"))),
    el("section", { class: "card" }, el("h2", {}, "State and county rules"),
      el("div", { class: "row" }, state, county, base, cap, source, el("button", { onclick: save }, "Save rule")),
      el("ol", {}, ...f.rules.map(r => el("li", {},
        `${r.state}${r.county ? " · " + r.county : " (whole state)"}: usual ${r.base_pct != null ? r.base_pct + "%" : "default"}, legal max ${r.legal_max_pct != null ? r.legal_max_pct + "%" : "none"} ${r.legal_source ? "· " + r.legal_source : ""} `,
        el("button", { class: "secondary", onclick: async () => { if (confirm("Delete this rule?")) { await api(`/admin/fees/rules/${r.id}`, { method: "DELETE" }); loadFees(); } } }, "Delete"))))));
}

async function loadAudit() {
  const v = await (await api("/admin/audit/verify")).json();
  const rows = await (await api("/admin/audit?limit=200")).json();
  $("#audit").replaceChildren(
    el("section", { class: "card" }, el("h2", {}, "Audit trail"),
      el("p", { class: v.ok ? "muted" : "" }, v.ok ? `Chain intact: ${v.entries} entries, each linked to the previous by SHA-256.` : `CHAIN BROKEN at entry #${v.broken_at}: a past record was changed or removed.`),
      el("ol", {}, ...rows.map(e => el("li", {}, `#${e.id} ${e.at} · ${e.actor_type}${e.actor_id ? " " + e.actor_id : ""} · ${e.action}${e.entity_type ? " · " + e.entity_type + " " + (e.entity_id ?? "") : ""} · ${e.ip || "-"} · ${e.device_info || e.user_agent || "-"}`)))));
}

async function claimAction(c, path, msg) {
  if (!confirm(msg)) return;
  try { await api(`/admin/claims/${c.id}/${path}`, { method: "POST" }); load(); } catch (e) { alert(e.message); }
}

async function load() {
  try { sessionStorage.setItem("surpay-admin", tokenInput.value); } catch {}
  $("#msg").textContent = "Loading…";
  const view = $("#view").value;
  for (const id of ["#list", "#pending", "#lawyers", "#relatives", "#fees", "#audit"]) $(id).replaceChildren();
  $("#filter").style.display = view === "claims" ? "" : "none";
  try {
    const who = await (await api("/admin/whoami")).json();
    const banner = $("#banner");
    banner.style.display = who.demo ? "block" : "none";
    banner.textContent = who.demo ? "Admin demo: you see and act only on demo data (Demo County, the demo accounts, and Demo County attorneys). Real people's records stay hidden. Fee settings are read-only." : "";
    if (view === "fees") { await loadFees(); $("#msg").textContent = ""; return; }
    if (view === "audit") { await loadAudit(); $("#msg").textContent = ""; return; }
    if (view === "claims") {
      const all = await (await api("/admin/claims")).json();
      const f = $("#filter").value;
      const rows = f ? all.filter(c => f.split(",").includes(c.status)) : all;
      $("#list").replaceChildren(...rows.map(render));
      $("#msg").textContent = `${rows.length} of ${all.length} claims`;
      return;
    }
    const rels = await (await api("/admin/relatives")).json();
    $("#relatives").replaceChildren(
      ...(rels.length ? [el("h2", {}, `Family claim reviews (${rels.length})`)] : []),
      ...rels.map(renderRelative));
    const lawyers = await (await api("/admin/attorneys")).json();
    $("#lawyers").replaceChildren(
      ...(lawyers.length ? [el("h2", {}, `Attorney applications (${lawyers.length})`)] : []),
      ...lawyers.map(renderAttorney));
    const pending = await (await api("/admin/identities")).json();
    $("#pending").replaceChildren(
      ...(pending.length ? [el("h2", {}, `Pending ID reviews (${pending.length})`)] : []),
      ...pending.map(renderIdentity));
    $("#msg").textContent = `${lawyers.length} attorney applications · ${pending.length} ID reviews · ${rels.length} family reviews waiting`;
  } catch (e) { $("#msg").textContent = e.message; }
}
$("#load").addEventListener("click", load);
$("#filter").addEventListener("change", load);
$("#view").addEventListener("change", load);
if (tokenInput.value) load();
</script>
</body>
</html>
