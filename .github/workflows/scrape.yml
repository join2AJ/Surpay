# Daily scrape into your hosted Postgres (the same one Render uses).
# Setup: repository Settings -> Secrets and variables -> Actions:
#   secret   SURPAY_DATABASE_URL   = your Neon connection string
#   secret   SURPAY_SECRET_KEY     = any long random string
#   variable SURPAY_SCRAPE_ENABLED = true
name: Daily scrape

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

jobs:
  scrape:
    if: ${{ vars.SURPAY_SCRAPE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m surpay.cli sync-counties && python -m surpay.cli scrape --all
        env:
          SURPAY_DATABASE_URL: ${{ secrets.SURPAY_DATABASE_URL }}
          SURPAY_SECRET_KEY: ${{ secrets.SURPAY_SECRET_KEY }}
      - name: Report county lists that changed
        if: always()
        run: python -m surpay.cli check-sources
        env:
          SURPAY_DATABASE_URL: ${{ secrets.SURPAY_DATABASE_URL }}
          SURPAY_SECRET_KEY: ${{ secrets.SURPAY_SECRET_KEY }}
