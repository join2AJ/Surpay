name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: gradle/actions/setup-gradle@v4
      - name: Start backend with demo data
        working-directory: backend
        run: |
          pip install -r requirements.txt
          export SURPAY_DATABASE_URL=sqlite:///./ci.db SURPAY_SECRET_KEY=ci
          python -m surpay.cli seed-demo
          nohup uvicorn surpay.api:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
      - name: Unit + end-to-end tests
        working-directory: android
        run: ./gradlew testDebugUnitTest -Pe2eUrl=http://127.0.0.1:8000/ -Proborazzi.test.record=true
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: surpay-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: android/app/build/outputs/roborazzi/
